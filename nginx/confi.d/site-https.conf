server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kaetsukokusai.com www.kaetsukokusai.com _;

    # --- SSL certificates (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/kaetsukokusai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaetsukokusai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/kaetsukokusai.com/chain.pem;

    include /etc/nginx/ssl-params.conf;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # --- Reverse proxy to backend instances (random) ---
    location / {
        proxy_pass         http://site_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
