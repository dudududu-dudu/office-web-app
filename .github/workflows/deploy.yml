name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:  # 允许手动触发

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Upload HTML files
        run: |
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Upload CSS files
        run: |
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "css/*.css" \
            --content-type "text/css; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload JS files
        run: |
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "js/*.js" \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload images and other assets
        run: |
          # SVG
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.svg" \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=2592000"

          # JPEG
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.jpg" --include "*.jpeg" \
            --content-type "image/jpeg" \
            --cache-control "public, max-age=2592000"

          # PNG
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.png" \
            --content-type "image/png" \
            --cache-control "public, max-age=2592000"

          # ICO
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.ico" \
            --content-type "image/x-icon" \
            --cache-control "public, max-age=2592000"

          # WebP
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*" \
            --include "*.webp" \
            --content-type "image/webp" \
            --cache-control "public, max-age=2592000"

      - name: Upload web manifest and other files
        run: |
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --exclude "*.html" \
            --exclude "css/*" \
            --exclude "js/*" \
            --exclude "*.svg" \
            --exclude "*.jpg" --exclude "*.jpeg" \
            --exclude "*.png" --exclude "*.ico" --exclude "*.webp" \
            --exclude "nginx-site.conf" \
            --exclude "Dockerfile.*" \
            --exclude "run_server.py" \
            --exclude "*.py" \
            --exclude "*.md"

      - name: Delete removed files from S3
        run: |
          aws s3 sync site/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --exclude "nginx-site.conf" \
            --exclude "Dockerfile.*" \
            --exclude "run_server.py" \
            --exclude "*.py" \
            --exclude "*.md"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
